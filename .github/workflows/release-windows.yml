name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache build data
        uses: actions/cache@v4
        with:
          path: |
            core/Common/3dParty
            build_tools/out
            sdkjs/build/node_modules
            web-apps/build/node_modules
            web-apps/build/sprites/node_modules
            desktop-apps/common/loginpage/build/node_modules
            C:\Users\runneradmin\.npm
          key: ${{ runner.os }}-release-${{ hashFiles('.gitmodules', 'sdkjs/build/npm-shrinkwrap.json', 'web-apps/build/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Global tools
        run: npm install -g grunt-cli @yao-pkg/pkg@6.11.0

      - name: Build and package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/windows/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktopeditors-windows-x64
          path: |
            desktop-apps/package/zip/*.zip
            desktop-apps/package/inno/Typsastra-*.exe
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${env:GITHUB_REF_NAME}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${env:GITHUB_REF_NAME}" --generate-notes }
          gh release upload "${env:GITHUB_REF_NAME}" desktop-apps/package/zip/*.zip desktop-apps/package/inno/Typsastra-*.exe --clobber
