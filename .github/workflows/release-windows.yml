name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache build data
        uses: actions/cache@v4
        with:
          path: |
            core/Common/3dParty
            build_tools/out
            sdkjs/build/node_modules
            web-apps/build/node_modules
            web-apps/build/sprites/node_modules
            desktop-apps/common/loginpage/build/node_modules
            C:\Users\runneradmin\.npm
          key: ${{ runner.os }}-release-${{ hashFiles('.gitmodules', 'sdkjs/build/npm-shrinkwrap.json', 'web-apps/build/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Global tools
        run: npm install -g grunt-cli @yao-pkg/pkg@6.11.0

      - name: Build and package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/windows/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: typsastra-office-windows-x64
          path: |
            desktop-apps/package/zip/Typsastra-Office-*.zip
            desktop-apps/package/inno/Typsastra-Office-*.exe
          if-no-files-found: error

      # release-init.yml is the only workflow that creates releases. Wait for
      # it before uploading so platform workflows cannot race each other.
      - name: Wait for release initialization
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            gh release view "${env:GITHUB_REF_NAME}" *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw "Release initialization did not create $env:GITHUB_REF_NAME within 20 minutes" }

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${env:GITHUB_REF_NAME}" desktop-apps/package/zip/Typsastra-Office-*.zip desktop-apps/package/inno/Typsastra-Office-*.exe --clobber
