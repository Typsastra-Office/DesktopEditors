name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. Only this entry creates the draft release: the two
          # jobs finish at about the same time, and letting both create it left
          # GitHub with two drafts for one tag.
          - arch: arm64
            runner: macos-14
            platform: darwin_arm64
            scheme: TypsastraOffice-arm
            create_release: true
          # Intel: GitHub's hosted Intel image (macos-13) no longer has runners,
          # so x86_64 is cross built on an Apple Silicon runner (Qt clang_64 is
          # universal and Rosetta runs the x86_64 build tools).
          - arch: x86_64
            runner: macos-14
            platform: darwin_x86_64
            scheme: TypsastraOffice-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache build data
        uses: actions/cache@v4
        with:
          path: |
            core/Common/3dParty
            build_tools/out
            sdkjs/build/node_modules
            web-apps/build/node_modules
            web-apps/build/sprites/node_modules
            desktop-apps/common/loginpage/build/node_modules
            ~/.npm
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ matrix.arch }}-release-${{ hashFiles('.gitmodules', 'sdkjs/build/npm-shrinkwrap.json', 'web-apps/build/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-release-
            ${{ runner.os }}-release-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: clang_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Global tools
        run: npm install -g grunt-cli @yao-pkg/pkg@6.11.0

      - name: Install compatible CMake
        run: |
          python3 -m pip install --disable-pip-version-check cmake==3.31.10
          CMAKE_BIN_DIR="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          echo "$CMAKE_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_BIN_DIR:$PATH"
          cmake --version | grep -F '3.31.10'

      - name: Rosetta (x86_64 build tools on Apple Silicon)
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Build and package
        run: bash ci/macos/build.sh ${{ matrix.platform }} ${{ matrix.scheme }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktopeditors-macos-${{ matrix.arch }}
          path: desktop-apps/package/macos/*.zip
          if-no-files-found: error

      # A draft gives a chance to check the artifact set before it is visible.
      # Running the workflow from a tag makes GITHUB_REF_NAME the tag; the tag
      # can be moved and the run repeated.
      - name: Publish draft release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: ${{ matrix.create_release }}
        run: |
          if [ "${CREATE_RELEASE}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" --draft --generate-notes 2>/dev/null || \
              gh release view "${GITHUB_REF_NAME}"
          else
            # Wait for the creating job; it builds in parallel, not before us.
            for _ in $(seq 1 90); do
              gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
              sleep 10
            done
            gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" desktop-apps/package/macos/*.zip --clobber
