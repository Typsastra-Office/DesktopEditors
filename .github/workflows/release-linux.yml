name: Release Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # The standard ubuntu-24.04 runner only guarantees ~14 GB of free disk
      # (GitHub's documented floor). This build writes ~24 GB of objects and
      # third-party trees plus a 2.2 GB bundle, so a cold run does not fit and
      # fails late with an unhelpful "No space left on device". Reclaim the
      # toolchains this build never uses, before the workspace is populated.
      #
      # Everything removed here is unrelated to a C++/Qt build. Deliberately
      # kept: /usr/local/lib/node_modules and the image's system Node, Python,
      # git, curl and the apt lists (deps.py installs and resolves against them).
      - name: Reclaim disk space
        run: |
          set -o pipefail
          echo "Before: $(df -h --output=source,size,used,avail,pcent,target / | tail -1)"
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /opt/powershell \
            /usr/local/share/powershell \
            /usr/share/az \
            /usr/local/share/gem \
            /usr/lib/mono \
            /usr/lib/golang \
            /opt/service
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
          echo "After:  $(df -h --output=source,size,used,avail,pcent,target / | tail -1)"

      # Fail here, in seconds, rather than 90 minutes into the build if the
      # reclaim above is not enough. At that point the only remaining option is
      # a larger runner, so say so explicitly.
      #
      # The floor covers the build plus packaging. Packaging stages its own copy
      # of the ~2.2 GB payload for each format (deb and rpm buildroots are
      # separate), so it needs several GB past the build itself.
      - name: Check free disk space
        env:
          REQUIRED_GB: 40
        run: |
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free space before building: ${free_gb} GB (need at least ${REQUIRED_GB} GB)"
          if [ "${free_gb}" -lt "${REQUIRED_GB}" ]; then
            echo "::error::Only ${free_gb} GB free on / after reclaiming runner toolchains; this build needs about ${REQUIRED_GB} GB. Switch this job to a larger runner." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # core/Common/3dParty is deliberately NOT cached: at ~22 GB (mostly V8) it
      # is more than twice the 10 GB per-repository cache quota, so the save
      # could never succeed, and restoring it would consume the disk the build
      # needs. Only the small, reusable toolchain pieces are cached.
      - name: Cache build data
        uses: actions/cache@v4
        with:
          path: |
            build_tools/tools/linux/qt_build
            build_tools/tools/linux/sysroot
            build_tools/tools/linux/cmake-3.30.0-linux-x86_64
            build_tools/out
            sdkjs/build/node_modules
            web-apps/build/node_modules
            web-apps/build/sprites/node_modules
            desktop-apps/common/loginpage/build/node_modules
            ~/.npm
          key: ${{ runner.os }}-release-v4-${{ hashFiles('.gitmodules', 'sdkjs/build/npm-shrinkwrap.json', 'web-apps/build/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-release-v4-

      - name: Build
        run: |
          set -o pipefail
          bash ci/linux/build.sh 2>&1 | tee ci-linux-build.log

      # build_tools/make_package.py -T desktop is the usual entry point, but on
      # Linux it builds both the opensource and commercial editions and all four
      # formats in one go, which this runner does not have room for. Drive the
      # same branding-aware Makefile directly and start with deb and rpm.
      #
      # The Makefile takes the payload from build_tools/out/linux_64/typsastra
      # and applies typsastra/desktop-apps/package/branding.mk, so the packages
      # are named typsastra-office. rpm-suse is not built here: it needs SUSE
      # macros a Ubuntu runner does not provide.
      - name: Package deb and rpm
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends \
            debhelper dpkg-dev fakeroot rpm

          # Same source of truth as ci/macos/build.sh: the branding repo owns
          # the release number (upstream base + Typsastra release).
          PRODUCT_VERSION="$(sed -n 's/^BRAND_BASE_VERSION *= *"\(.*\)"/\1/p' typsastra/build_tools/make.py)"
          BUILD_NUMBER="$(sed -n 's/^BRAND_RELEASE *= *"\(.*\)"/\1/p' typsastra/build_tools/make.py)"
          if [ -z "${PRODUCT_VERSION}" ] || [ -z "${BUILD_NUMBER}" ]; then
            echo "::error::could not read the branding version from typsastra/build_tools/make.py" >&2
            exit 1
          fi
          echo "packaging ${PRODUCT_VERSION}-${BUILD_NUMBER}"

          cd desktop-apps/package
          make clean
          make deb rpm \
            BRANDING_DIR=../../typsastra/desktop-apps/package \
            CC_LICENSE_FILE=common/license/opensource/LICENSE-CC.txt \
            PRODUCT_VERSION="${PRODUCT_VERSION}" \
            BUILD_NUMBER="${BUILD_NUMBER}" \
            2>&1 | tee ../../ci-linux-package.log

          if ! compgen -G "deb/*.deb" > /dev/null; then
            echo "::error::no .deb was produced" >&2
            exit 1
          fi
          if ! compgen -G "rpm/build/RPMS/*/*.rpm" > /dev/null; then
            echo "::error::no .rpm was produced" >&2
            exit 1
          fi
          RELEASE_VERSION="${PRODUCT_VERSION}.${BUILD_NUMBER}"
          DEB_FILE=(deb/*.deb)
          RPM_FILE=(rpm/build/RPMS/*/*.rpm)
          mv "${DEB_FILE[0]}" "deb/Typsastra-Office-${RELEASE_VERSION}-Linux-x64.deb"
          mv "${RPM_FILE[0]}" "$(dirname "${RPM_FILE[0]}")/Typsastra-Office-${RELEASE_VERSION}-Linux-x64.rpm"
          ls -lh deb/*.deb rpm/build/RPMS/*/*.rpm

      # If the build fails there is no way to tell from the run summary alone
      # which stage broke, and the workflow log is not retrievable without
      # authentication. Stage the tail of the build output and the toolchain
      # state so a failure is diagnosable from the artifacts.
      - name: Collect build diagnostics
        if: failure()
        run: |
          {
            echo "### git state"
            git log -1 --oneline || true
            git submodule status || true
            echo
            echo "### toolchain"
            echo "cmake: $(command -v cmake) $(cmake --version 2>/dev/null | head -1)"
            echo "python: $(python3 --version 2>&1)"
            echo "node:   $(node -v 2>&1)"
            echo "gcc:    $(gcc --version 2>/dev/null | head -1)"
            echo
            echo "### disk"
            df -h / "${GITHUB_WORKSPACE}" 2>/dev/null || df -h /
            echo "largest consumers under the workspace:"
            du -sh "${GITHUB_WORKSPACE}"/* 2>/dev/null | sort -rh | head -10
            echo
            echo "### last 200 lines of the build"
            tail -n 200 ci-linux-build.log 2>/dev/null || echo "(no ci-linux-build.log)"
          } | tee build-diagnostics.txt
          tail -n 4000 ci-linux-build.log > ci-linux-build-tail.log 2>/dev/null || true

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-diagnostics
          path: |
            build-diagnostics.txt
            ci-linux-build-tail.log
            ci-linux-package.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package tarball
        run: |
          PRODUCT_VERSION="$(sed -n 's/^BRAND_BASE_VERSION *= *"\(.*\)"/\1/p' typsastra/build_tools/make.py)"
          BUILD_NUMBER="$(sed -n 's/^BRAND_RELEASE *= *"\(.*\)"/\1/p' typsastra/build_tools/make.py)"
          if [ -z "${PRODUCT_VERSION}" ] || [ -z "${BUILD_NUMBER}" ]; then
            echo "::error::could not read the branding version from typsastra/build_tools/make.py" >&2
            exit 1
          fi
          cd build_tools/out/linux_64/typsastra
          tar -czf "${GITHUB_WORKSPACE}/Typsastra-Office-${PRODUCT_VERSION}.${BUILD_NUMBER}-Linux-x64.tar.gz" desktopeditors

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: typsastra-office-linux-x64
          path: |
            Typsastra-Office-*.tar.gz
            desktop-apps/package/deb/*.deb
            desktop-apps/package/rpm/build/RPMS/*/*.rpm
          if-no-files-found: error

      # A draft gives a chance to check the artifact set before it is visible.
      # Running the workflow from a tag makes GITHUB_REF_NAME the tag; the tag
      # can be moved and the run repeated.
      - name: Publish draft release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes 2>/dev/null || \
            gh release view "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" \
            Typsastra-Office-*.tar.gz \
            desktop-apps/package/deb/Typsastra-Office-*.deb \
            desktop-apps/package/rpm/build/RPMS/*/Typsastra-Office-*.rpm \
            --clobber
