name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to initialize (defaults to the selected ref)
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-init-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; platform builds will replace their assets."
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft --generate-notes
          fi
